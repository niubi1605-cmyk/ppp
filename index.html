<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>哔哩哔哩 (゜-゜)つロ 干杯~-bilibili</title>
<style>
:root{
  --pink:#fb7299; --pink-d:#e85c85; --blue:#00aeec;
  --bg:#f6f7f8; --text:#18191c; --sub:#9499a0; --line:#e3e5e7;
  --gold:#e6a23c; --gold-d:#d48806;
  --card-shadow:0 1px 2px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;overscroll-behavior-y:none;
}
body.theater{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea,select{font-family:inherit;outline:none;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d0d2d6;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#b8bbc0}
::-webkit-scrollbar-track{background:transparent}
.no-select{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:300;height:56px;background:#fff;
  display:flex;align-items:center;gap:14px;padding:0 20px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.logo{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;
  color:var(--pink);cursor:pointer;white-space:nowrap;letter-spacing:.3px;flex:none}
.logo svg{width:30px;height:24px;flex:none;transition:transform .2s}
.logo:hover svg{transform:rotate(-6deg) scale(1.08)}
.search{flex:1;max-width:480px;display:flex;background:#f1f2f3;border-radius:8px;
  overflow:hidden;height:38px;align-items:center;padding-left:14px;transition:.15s}
.search:focus-within{background:#fff;box-shadow:0 0 0 2px var(--pink)}
.search input{flex:1;font-size:14px;height:100%;color:var(--text);min-width:0}
.search button{width:56px;height:100%;background:var(--pink);color:#fff;font-size:14px;font-weight:600;flex:none;transition:.15s}
.search button:hover{background:var(--pink-d)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.coin-pill{display:flex;align-items:center;gap:5px;background:#f1f2f3;border-radius:16px;
  padding:5px 12px;font-size:13px;font-weight:600;color:#61666d;cursor:pointer;transition:.15s}
.coin-pill:hover{background:#e6e7e9;transform:translateY(-1px)}
.btn-upload{background:var(--pink);color:#fff;padding:8px 16px;border-radius:8px;
  font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-upload:hover{background:var(--pink-d);transform:translateY(-1px)}
.vip-btn{background:linear-gradient(100deg,#ffd48a,#e6a23c);color:#5b3a00;
  padding:7px 14px;border-radius:8px;font-weight:800;font-size:13px;
  display:flex;align-items:center;gap:5px;white-space:nowrap;transition:.15s;
  box-shadow:0 2px 8px rgba(230,162,60,.35)}
.vip-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.vip-btn.on{background:linear-gradient(100deg,#3a3f4a,#262a33);color:#ffd48a;
  box-shadow:0 2px 10px rgba(0,0,0,.25)}
.avatar{position:relative;width:36px;height:36px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
  cursor:pointer;flex:none;user-select:none;transition:.15s}
.avatar:hover{transform:scale(1.06)}
.avatar .pendant{position:absolute;right:-5px;bottom:-5px;font-size:14px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));pointer-events:none}
.avatar.sm{width:34px;height:34px;font-size:14px}
.avatar.sm .pendant{font-size:12px;right:-4px;bottom:-4px}
.avatar.lg{width:56px;height:56px;font-size:22px}
.avatar.lg .pendant{font-size:20px;right:-6px;bottom:-6px}
.avatar.xl{width:76px;height:76px;font-size:30px}
.avatar.xl .pendant{font-size:26px;right:-8px;bottom:-8px}
@media(max-width:760px){
  .logo span{display:none}
  .search{max-width:none}
  .coin-pill{display:none}
  .btn-upload{padding:7px 12px;font-size:13px}
  .vip-btn{padding:6px 10px;font-size:12px}
}

/* ============ 布局 ============ */
#view{max-width:1420px;margin:0 auto;padding:20px 20px 90px;min-height:calc(100vh - 56px)}
@media(max-width:640px){#view{padding:10px 8px 70px}.topbar{padding:0 10px;gap:8px}}

/* ============ 首页 Hero ============ */
.hero{
  background:linear-gradient(115deg,#fb7299 0%,#ff92b3 45%,#ffc0d4 100%);
  border-radius:14px;padding:24px 28px;color:#fff;margin-bottom:24px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden;
}
.hero::after{content:'';position:absolute;right:-70px;top:-70px;width:240px;height:240px;
  background:rgba(255,255,255,.15);border-radius:50%;pointer-events:none}
.hero::before{content:'';position:absolute;left:-40px;bottom:-90px;width:180px;height:180px;
  background:rgba(255,255,255,.1);border-radius:50%;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .hname{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .hsub{opacity:.92;margin-top:8px;font-size:13px;line-height:1.6}
.hero .hstats{display:flex;gap:32px;margin-left:auto;flex-wrap:wrap}
.hero .hstat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.hero .hstat span{font-size:12px;opacity:.88}
@media(max-width:640px){.hero{padding:16px;gap:16px}.hero .hname{font-size:18px}.hero .hstat b{font-size:18px}}

/* ============ 视频卡片 ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:22px 16px}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 10px}}
.card{cursor:pointer;transition:transform .18s;animation:cardIn .3s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px)}
.cover{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.cover .ct{font-size:14px;font-weight:800;color:#fff;line-height:1.4;
  text-shadow:0 2px 10px rgba(0,0,0,.35);display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden}
.cover .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.62);
  color:#fff;font-size:12px;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.cover .cstat{position:absolute;left:8px;bottom:7px;color:#fff;font-size:12px;
  text-shadow:0 1px 4px rgba(0,0,0,.75);display:flex;gap:10px;font-variant-numeric:tabular-nums}
.cover .vip-tag{position:absolute;left:6px;top:6px;background:linear-gradient(100deg,#ffd48a,#e6a23c);
  color:#5b3a00;font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;
  box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cover .progress-mini{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.35)}
.cover .progress-mini span{display:block;height:100%;background:var(--pink);width:0}
.vtitle{font-size:15px;line-height:1.42;margin-top:10px;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--sub);font-size:12px;flex-wrap:wrap}

/* ============ 徽章 ============ */
.badge{font-size:11px;padding:1px 5px;border-radius:3px;font-weight:700;
  line-height:1.5;flex:none;white-space:nowrap}
.badge.vip{background:linear-gradient(100deg,#ffd48a,#e6a23c);color:#5b3a00}
.badge.up{background:#00aeec;color:#fff}
.badge.lv{background:#f1f2f3;color:#9499a0;font-weight:600}
.badge.hot{background:#ff5722;color:#fff}
.badge.charge{background:#ff6699;color:#fff}

/* ============ 播放页 ============ */
.video-page{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:24px;align-items:start}
@media(max-width:1020px){.video-page{grid-template-columns:1fr}}
.player-wrap{position:relative}
.player{position:relative;background:#000;border-radius:10px;overflow:hidden;
  aspect-ratio:16/9;user-select:none;transition:border-radius .25s}
.player.theater{
  position:fixed;inset:0;z-index:500;border-radius:0;aspect-ratio:auto;
  display:flex;align-items:center;justify-content:center
}
body.theater{background:#000}
body.theater .topbar{transform:translateY(-100%);transition:transform .3s}
body.theater #view{display:none}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transition:filter .3s}
.player.theater video{position:relative;width:100%;height:100%;object-fit:contain}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;transition:filter .3s}
.screen-bg{position:absolute;inset:-25%;animation:bgmove 26s ease-in-out infinite alternate}
@keyframes bgmove{from{transform:scale(1) rotate(0)}to{transform:scale(1.22) rotate(6deg)}}
.screen-title{position:relative;z-index:2;color:rgba(255,255,255,.94);
  font-size:clamp(14px,2.2vw,22px);font-weight:800;text-align:center;padding:0 48px;
  text-shadow:0 2px 16px rgba(0,0,0,.6);line-height:1.5}
.dm-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6}
.dm{position:absolute;left:100%;white-space:nowrap;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.9);will-change:transform}
@keyframes dmfly{from{transform:translateX(0)}to{transform:translateX(var(--dist))}}
.dm-top{position:absolute;left:50%;top:9%;transform:translateX(-50%);
  white-space:nowrap;font-weight:800;z-index:7;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.9);animation:dmTopIn 3.6s ease forwards}
@keyframes dmTopIn{
  0%{opacity:0;transform:translate(-50%,-12px)}
  8%,86%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-12px)}
}
.dm-bottom{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);
  white-space:nowrap;font-weight:800;z-index:7;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.9);animation:dmBottomIn 3.6s ease forwards}
@keyframes dmBottomIn{
  0%{opacity:0;transform:translate(-50%,12px)}
  8%,86%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,12px)}
}
.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:12;display:flex;align-items:center;
  gap:8px;padding:10px 12px 12px;color:#fff;font-size:13px;
  background:linear-gradient(transparent,rgba(0,0,0,.82));flex-wrap:nowrap}
.ctrl button{color:#fff;font-size:15px;opacity:.94;transition:.15s;flex:none;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:6px}
.ctrl button:hover{opacity:1;background:rgba(255,255,255,.15)}
.ctrl button.on{color:var(--pink)}
.progress{flex:1;min-width:60px;height:20px;display:flex;align-items:center;cursor:pointer;position:relative}
.progress .track{width:100%;height:4px;background:rgba(255,255,255,.32);border-radius:2px;overflow:hidden;position:relative}
.progress .bar{height:100%;width:0;background:var(--pink);border-radius:2px}
.progress .handle{position:absolute;left:0;top:50%;width:12px;height:12px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform .15s;
  pointer-events:none}
.progress:hover .track{height:6px}
.progress:hover .handle{transform:translate(-50%,-50%) scale(1)}
.time-text{font-variant-numeric:tabular-nums;font-size:12px;opacity:.9;flex:none;padding:0 4px}
.dm-input{width:140px;background:rgba(255,255,255,.18);border-radius:14px;
  padding:5px 12px;color:#fff;font-size:13px;height:28px;flex:none;transition:.15s}
.dm-input:focus{background:rgba(255,255,255,.3)}
.dm-input::placeholder{color:rgba(255,255,255,.6)}
.ctrl .dm-input{width:auto;flex:1;max-width:180px;min-width:80px}
@media(max-width:640px){
  .ctrl{gap:5px;padding:8px 8px 10px}
  .ctrl button{width:26px;height:26px;font-size:14px}
  .time-text{font-size:11px;padding:0 2px}
  .ctrl .dm-input{font-size:12px;height:26px;padding:4px 10px}
}

/* 画质菜单 / 倍速菜单 共用 */
.menu-pop{position:absolute;right:12px;bottom:52px;background:rgba(24,25,28,.96);
  border-radius:8px;padding:6px;z-index:20;min-width:150px;color:#fff;
  box-shadow:0 8px 30px rgba(0,0,0,.4);animation:menuIn .16s ease;backdrop-filter:blur(6px)}
@keyframes menuIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.menu-pop .qm-item{padding:8px 12px;border-radius:6px;font-size:13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;transition:.12s}
.menu-pop .qm-item:hover{background:rgba(255,255,255,.12)}
.menu-pop .qm-item.on{color:var(--pink);font-weight:700}
.menu-pop .qm-item .lock{font-size:11px;color:#e6a23c;font-weight:700}
.menu-pop .qm-title{font-size:11px;color:#8a8f99;padding:4px 12px;font-weight:600}
.menu-pop .qm-divider{height:1px;background:rgba(255,255,255,.08);margin:4px 6px}

/* 三连动画 */
.triple-anim{position:fixed;pointer-events:none;z-index:999;font-size:34px;
  font-weight:800;animation:triplePop .9s ease forwards;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
@keyframes triplePop{
  0%{opacity:0;transform:scale(.4) translateY(0)}
  30%{opacity:1;transform:scale(1.15) translateY(-14px)}
  100%{opacity:0;transform:scale(1) translateY(-58px)}
}
.like-burst{position:absolute;pointer-events:none;font-size:22px;
  animation:burst .8s ease forwards}
@keyframes burst{
  0%{opacity:1;transform:translate(0,0) scale(.6)}
  100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(1.3)}
}

/* 视频信息 */
.v-title{font-size:20px;font-weight:700;line-height:1.45;margin:18px 0 10px;word-break:break-word}
.v-stats{color:var(--sub);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
.action-row{display:flex;gap:10px;margin:16px 0 20px;flex-wrap:wrap}
.act-btn{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:8px 18px;font-size:14px;color:#61666d;transition:.15s;
  font-weight:500;white-space:nowrap;position:relative;overflow:hidden}
.act-btn:hover{border-color:var(--pink);color:var(--pink);transform:translateY(-1px)}
.act-btn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.act-btn.on:hover{background:var(--pink-d)}
.act-btn:disabled{opacity:.55;cursor:not-allowed}
.act-btn:disabled:hover{border-color:var(--line);color:#61666d;transform:none}
.act-btn .cnt{font-variant-numeric:tabular-nums}
.up-card{background:#fff;border-radius:10px;padding:16px;display:flex;align-items:center;
  gap:14px;margin-bottom:18px;flex-wrap:wrap}
.up-card .uinfo{flex:1;min-width:140px}
.up-card .uname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.up-card .ufans{color:var(--sub);font-size:12px;margin-top:5px}
.btn-follow{background:var(--pink);color:#fff;padding:8px 22px;border-radius:8px;
  font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-follow:hover{background:var(--pink-d);transform:translateY(-1px)}
.btn-follow.on{background:#f1f2f3;color:#9499a0}
.btn-follow.on:hover{background:#e6e7e9;color:#61666d}
.btn-charge{background:linear-gradient(100deg,#ffd48a,#e6a23c);color:#5b3a00;
  padding:8px 18px;border-radius:8px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn-charge:hover{filter:brightness(1.06);transform:translateY(-1px)}
.desc-box{background:#fff;border-radius:10px;padding:16px;font-size:14px;
  line-height:1.7;color:#41464d;margin-bottom:18px;white-space:pre-wrap;word-break:break-word}
.tags-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag-pill{font-size:12px;background:#f1f2f3;color:#61666d;padding:4px 12px;border-radius:14px;
  cursor:pointer;transition:.15s}
.tag-pill:hover{background:#ffe4ee;color:var(--pink)}

/* ============ 评论区 ============ */
.cmt-section{background:#fff;border-radius:10px;padding:20px}
@media(max-width:640px){.cmt-section{padding:14px}}
.cmt-head{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:10px}
.cmt-head .ct{display:flex;align-items:baseline;gap:6px}
.cmt-head .ct span{font-size:14px;color:var(--sub);font-weight:400}
.cmt-sort{display:flex;gap:4px;background:#f1f2f3;border-radius:8px;padding:3px}
.cmt-sort button{font-size:12px;padding:4px 12px;border-radius:6px;color:#61666d;
  transition:.15s;font-weight:600}
.cmt-sort button.on{background:#fff;color:var(--pink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cmt-input{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.cmt-input .ipt-wrap{flex:1;background:#f1f2f3;border-radius:8px;padding:4px;transition:.15s;min-width:0}
.cmt-input .ipt-wrap:focus-within{background:#fff;box-shadow:0 0 0 2px var(--pink)}
.cmt-input .ipt{width:100%;background:transparent;padding:8px 10px;font-size:14px;
  resize:none;min-height:38px;line-height:1.5;display:block}
.cmt-input .ipt-bar{display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 4px;border-top:1px solid rgba(0,0,0,.04);margin-top:2px}
.cmt-input .emoji-btn{font-size:16px;padding:4px 8px;border-radius:6px;color:#61666d;
  transition:.15s;cursor:pointer}
.cmt-input .emoji-btn:hover{background:#e6e7e9}
.cmt-input .send{background:var(--pink);color:#fff;border-radius:8px;padding:0 20px;
  font-weight:600;font-size:14px;transition:.15s;flex:none;height:36px;align-self:flex-end}
.cmt-input .send:hover{background:var(--pink-d)}
.cmt-input .send:disabled{opacity:.5;cursor:not-allowed}
.emoji-panel{display:flex;gap:4px;flex-wrap:wrap;padding:8px 4px 4px;max-height:120px;
  overflow-y:auto;border-top:1px solid #f1f2f3;margin-top:6px}
.emoji-panel span{font-size:20px;cursor:pointer;padding:3px 6px;border-radius:6px;transition:.12s}
.emoji-panel span:hover{background:#ffe4ee;transform:scale(1.15)}
.cmt-tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cmt-tool{font-size:12px;padding:5px 12px;border-radius:14px;background:#f1f2f3;
  color:#61666d;cursor:pointer;transition:.15s;font-weight:500}
.cmt-tool:hover{background:#e6e7e9}
.cmt-tool.on{background:var(--pink);color:#fff}
.cmt{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid #f1f2f3;animation:cmtIn .28s ease both}
@keyframes cmtIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.cmt:last-child{border-bottom:none}
.cmt-body{flex:1;min-width:0}
.cmt-name{color:#61666d;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cmt-name .up-tag{background:#00aeec;color:#fff;font-size:11px;padding:1px 5px;border-radius:3px;font-weight:700}
.cmt-name .pin-tag{background:var(--pink);color:#fff;font-size:11px;padding:1px 5px;border-radius:3px;font-weight:700}
.cmt-text{margin-top:6px;font-size:15px;line-height:1.62;word-break:break-word}
.cmt-text.bubble{background:linear-gradient(135deg,#fff0f5,#ffe4ee);padding:8px 12px;
  border-radius:10px;display:inline-block;color:#c2185b}
.cmt-text.bubble.gold{background:linear-gradient(135deg,#fff8e1,#ffe9b8);color:#8a6d00}
.cmt-foot{margin-top:8px;color:var(--sub);font-size:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cmt-foot .lk{cursor:pointer;transition:.15s;display:flex;align-items:center;gap:4px;user-select:none}
.cmt-foot .lk:hover{color:var(--pink)}
.cmt-foot .lk.on{color:var(--pink);font-weight:700}
.replies{margin-top:10px;background:#f7f8fa;border-radius:8px;padding:10px 14px}
.reply{font-size:13px;line-height:1.8;color:#41464d;word-break:break-word;padding:3px 0}

function fmt(n){
  n = Number(n) || 0;
  if(Math.abs(n) >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '亿';
  if(Math.abs(n) >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'') + '万';
  return String(Math.round(n));
}
function fmtDur(s){
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  const p = v => String(v).padStart(2,'0');
  return h > 0 ? `${p(h)}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function timeAgo(ts){
  const d = (Date.now()-ts)/1000;
  if(d < 0) return '刚刚';
  if(d < 60) return '刚刚';
  if(d < 3600) return Math.floor(d/60)+'分钟前';
  if(d < 86400) return Math.floor(d/3600)+'小时前';
  if(d < 86400*30) return Math.floor(d/86400)+'天前';

}

  return String(s == null ? '' : s)

/* Toast */
function toast(html, ms){
  ms = ms || 3200;

  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');

  }, ms);
  while(wrap.children.length > 6) wrap.firstChild.remove();

/* Modal */
function openModal(html, opts){
  opts = opts || {};
  const root = document.getElementById('modalRoot');

    (opts.noClose ? '' : '<button class="modal-close" data-close>✕</button>') +
    html + '</div></div>';
  const mask = root.querySelector('.modal-mask');
  mask.addEventListener('click', e => {
    if(e.target === mask && !opts.noClose) closeModal();
  });
  const cb = root.querySelector('[data-close]');
  if(cb) cb.addEventListener('click', closeModal);
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  root.style.display = 'none';

function mergeDeep(target, src){
  if(!src || typeof src !== 'object') return target;
  for(const k in src){
    if(Array.isArray(src[k])){
      target[k] = src[k];
    }else if(src[k] && typeof src[k] === 'object'){
      target[k] = mergeDeep(target[k] && typeof target[k] === 'object' ? target[k] : {}, src[k]);
    }else{
      target[k] = src[k];
    }
  }
  return target;
}

const recentTexts = [];
const MAX_RECENT = 24;

function buildPoolForVideo(video){
  const pool = [];
  const tags = video.tags || [];
  tags.forEach(t => { if(TAG_POOL[t]) pool.push.apply(pool, TAG_POOL[t]); });
  if(TAG_POOL[video.partition]) pool.push.apply(pool, TAG_POOL[video.partition]);
  Object.values(POOL).forEach(arr => pool.push.apply(pool, arr));
  return pool.length ? pool : POOL.short;
}

function fillTemplate(text, video){
  return String(text)
    .replace(/\{up\}/g, state.user.name)
    .replace(/\{title\}/g, video.title)
    .replace(/\{tag\}/g, (video.tags && video.tags[0]) || '视频');
}

function genText(video){
  if(!video._pool) video._pool = buildPoolForVideo(video);
  const pool = video._pool;
  for(let i=0;i<14;i++){
    const t = fillTemplate(pick(pool), video);
    if(recentTexts.indexOf(t) < 0){
      recentTexts.push(t);
      if(recentTexts.length > MAX_RECENT) recentTexts.shift();
      return t;
    }
  }
  return fillTemplate(pick(pool), video);
}

function randomUser(){
  const useSolo = Math.random() < 0.58;
  const name = useSolo ? pick(SOLO_NAMES) : pick(NAME_A) + pick(NAME_B);
  return {
    name: name,
    color: pick(AVATAR_COLORS),
    vip: Math.random() < 0.22,
    level: ri(1,6)
  };
}

function genReplies(){
  const n = ri(1,3);
  const out = [];
  for(let i=0;i<n;i++){
    out.push({ user: randomUser(), text: pick(REPLY_POOL) });
  }
  return out;
}

function randLikes(hot){
  if(hot) return ri(1200, 12000);
  return Math.floor(Math.pow(Math.random(), 2.4) * 4200);
}

function makeComment(video, opts){
  opts = opts || {};
  const u = randomUser();
  return {
    id: uid(),
    user: u,
    text: opts.text || genText(video),
    likes: opts.likes !== undefined ? opts.likes : randLikes(opts.hot),
    liked: false,
    isUp: !!opts.isUp,
    time: Date.now() - ri(30, 86400*25) * 1000,
    replies: (!opts.noReply && Math.random() < 0.45) ? genReplies() : []
  };
}

const MAX_COMMENTS = 240;

function ensureComments(video, n){
  if(!video.comments) video.comments = [];
  const add = Math.min(n, MAX_COMMENTS - video.comments.length);
  for(let i=0;i<add;i++){
    const hot = video.comments.length < 3;
    video.comments.push(makeComment(video, { hot: hot }));
  }
  return video.comments;
}

function seedComments(video){
  if(video.seeded) return;
  video.seeded = true;
  ensureComments(video, 22);
}

let dmTrackIdx = 0;
const DM_TRACKS = 8;

function nextDmTop(){
  const t = dmTrackIdx % DM_TRACKS;
  dmTrackIdx++;
  return 5 + t * (state.settings.dmArea * 100 / DM_TRACKS);
}

function buildDanmakuList(video){
  const n = clamp(Math.floor(video.duration / 5), 40, 220);
  const list = [];
  for(let i=0;i<n;i++){
    list.push({
      t: Math.random() * video.duration,
      text: pick(DANMAKU_POOL),
      color: pick(DM_COLORS)
    });
  }
  return list.sort((a,b) => a.t - b.t);
}

function shootDanmaku(text, opts){
  opts = opts || {};
  if(!state.settings.danmakuOn) return;
  const layer = document.getElementById('dmLayer');
  if(!layer) return;

  // 关键词屏蔽
  const kws = state.settings.dmBlockKeywords || [];
  for(const kw of kws){
    if(kw && text.indexOf(kw) >= 0) return;
  }

  const type = opts.type || state.settings.dmType || 'scroll';
  const vip = isVip();
  let color = opts.color;
  if(!color) color = vip ? pick(DM_COLORS) : '#ffffff';

  const el = document.createElement('div');
  el.textContent = text;
  el.style.opacity = state.settings.dmOpacity;

  if(type === 'top'){
    el.className = 'dm-top';
    el.style.color = color;
    el.style.fontSize = (ri(16,20) * state.settings.dmFontSize) + 'px';
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
    setTimeout(() => { if(el.parentNode) el.remove(); }, 4200);
    return;
  }
  if(type === 'bottom'){
    el.className = 'dm-bottom';
    el.style.color = color;
    el.style.fontSize = (ri(16,20) * state.settings.dmFontSize) + 'px';
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
    setTimeout(() => { if(el.parentNode) el.remove(); }, 4200);
    return;
  }

  el.className = 'dm';
  el.style.top = nextDmTop() + '%';
  el.style.color = color;
  el.style.fontSize = (ri(15, 20) * state.settings.dmFontSize) + 'px';
  layer.appendChild(el);
  const w = layer.clientWidth || 800;
  const dist = w + el.offsetWidth + 60;
  el.style.setProperty('--dist', -dist + 'px');
  const baseDur = 5.5 + dist/220;
  el.style.animation = `dmfly ${(baseDur / state.settings.dmSpeed).toFixed(1)}s linear forwards`;
  el.addEventListener('animationend', () => el.remove());
  setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 20000);
}

let P = null;
let currentVideoId = null;
let playerEventsBound = false;

function stopPlayer(){
  if(P && P.timer){
    clearInterval(P.timer);
    P.timer = null;
  }
  P = null;
}

function currentVideo(){
  return state.videos.find(v => v.id === currentVideoId) || null;
}

function startPlayer(video){
  stopPlayer();
  const dmList = buildDanmakuList(video);
  P = {
    cur: 0,
    dur: video.duration,
    playing: true,
    dmList: dmList,
    idx: 0,
    video: video,
    real: false,
    speed: 7,
    counted: false
  };

  const videoEl = document.getElementById('videoEl');
  if(video.videoUrl && videoEl){
    videoEl.src = video.videoUrl;
    videoEl.muted = state.settings.muted;
    videoEl.volume = state.settings.volume;
    videoEl.playbackRate = state.settings.speed;
    const p = videoEl.play();
    if(p && p.catch) p.catch(()=>{});
    P.real = true;
    P.speed = 1;
    videoEl.addEventListener('ended', () => {
      if(!P) return;
      P.cur = 0;
      P.idx = 0;
      updateProgressUI();
    });
    videoEl.addEventListener('loadedmetadata', () => {
      if(P && isFinite(videoEl.duration) && videoEl.duration > 0){
        P.dur = videoEl.duration;
      }
    });
  }

  P.timer = setInterval(tick, 100);
}

function tick(){
  if(!P) return;
  const ve = document.getElementById('videoEl');

  if(P.real && ve){
    if(!P.playing){ return; }
    P.cur = ve.currentTime || 0;
    if(isFinite(ve.duration) && ve.duration > 0) P.dur = ve.duration;
  }else{
    if(!P.playing){ updateProgressUI(); return; }
    P.cur += 0.1 * P.speed * state.settings.speed;
  }

  if(P.cur >= P.dur){
    P.cur = 0;
    P.idx = 0;
    if(P.real && ve){ ve.currentTime = 0; }
  }

  updateProgressUI();

  if(!P.counted && P.cur > 3 && P.video){
    P.counted = true;
    P.video.views++;
  }

  while(P.idx < P.dmList.length && P.dmList[P.idx].t <= P.cur){
    const d = P.dmList[P.idx];
    shootDanmaku(d.text, { color: d.color });
    P.idx++;
  }
}

function updateProgressUI(){
  if(!P) return;
  const bar = document.getElementById('progBar');
  const txt = document.getElementById('timeText');
  const handle = document.getElementById('progHandle');
  const pct = clamp(P.cur / P.dur * 100, 0, 100);
  if(bar) bar.style.width = pct + '%';
  if(handle) handle.style.left = pct + '%';
  if(txt) txt.textContent = fmtDur(P.cur) + ' / ' + fmtDur(P.dur);
}

function applyQuality(){
  const q = QUALITIES.find(x => x.id === state.settings.quality) || QUALITIES[2];
  const screen = document.getElementById('screen');
  const videoEl = document.getElementById('videoEl');
  const target = videoEl || screen;

}

  }
}

  document.body.classList.toggle('theater', on);
  const btn = document.getElementById('theaterBtn');

    if(isMobile() && screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});

    // 显示提示（仅当横屏失败时）

      if(window.innerHeight > window.innerWidth && isMobile()){

    if(screen.orientation && screen.orientation.unlock){
      try{ screen.orientation.unlock(); }catch(e){}
    }
    const hint = document.getElementById('rotateHint');
    if(hint) hint.classList.remove('show');
  }
}

  document.documentElement.style.setProperty('--pink', color);

}
function shade(hex, percent){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent) / 100;
  r = Math.round((t - r) * p) + r;
  g = Math.round((t - g) * p) + g;
  b = Math.round((t - b) * p) + b;
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* 评论列表 */
let cmtSort = 'hot';

function sortedComments(v){
  const arr = v.comments.slice();
  if(cmtSort === 'hot'){
    arr.sort((a,b) => {
      // 置顶优先
      if(v.pinned === a.id) return -1;
      if(v.pinned === b.id) return 1;
      return b.likes - a.likes;
    });
  }else{
    arr.sort((a,b) => {
      if(v.pinned === a.id) return -1;
      if(v.pinned === b.id) return 1;
      return b.time - a.time;
    });
  }
  return arr;
}

function renderCommentList(video, reset){
  const list = document.getElementById('cmtList');
  if(!list) return;
  const arr = sortedComments(video);
  if(reset){
    list.innerHTML = arr.map(c => commentHTML(c, video)).join('');
  }
  const cc = document.getElementById('cmtCount');
  if(cc) cc.textContent = fmt(video.commentCountBase + video.comments.length);
}

/* 绑定播放页事件 */
function bindVideoEvents(v){
  /* 播放/暂停 */
  const playBtn = document.getElementById('playBtn');
  if(playBtn) playBtn.onclick = () => {
    if(!P) return;
    P.playing = !P.playing;
    playBtn.textContent = P.playing ? '⏸' : '▶';
    const ve = document.getElementById('videoEl');
    if(ve){
      if(P.playing){ const p = ve.play(); if(p && p.catch) p.catch(()=>{}); }
      else ve.pause();
    }
  };

  /* 下一个 */
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = () => {
    const idx = state.videos.findIndex(x => x.id === v.id);
    const next = state.videos[(idx + 1) % state.videos.length];
    if(next) go('video', next.id);
  };

  /* 进度条 */
  const prog = document.getElementById('progress');
  if(prog){
    let dragging = false;
    const seek = (clientX) => {
      if(!P) return;
      const r = prog.getBoundingClientRect();
      P.cur = clamp((clientX - r.left) / r.width, 0, 1) * P.dur;
      P.idx = 0;
      const ve = document.getElementById('videoEl');
      if(P.real && ve) ve.currentTime = P.cur;
      updateProgressUI();
    };
    prog.addEventListener('mousedown', e => { dragging = true; seek(e.clientX); });
    prog.addEventListener('touchstart', e => { dragging = true; seek(e.touches[0].clientX); }, {passive:true});
    window.addEventListener('mousemove', e => { if(dragging) seek(e.clientX); });
    window.addEventListener('touchmove', e => { if(dragging) seek(e.touches[0].clientX); }, {passive:true});
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('touchend', () => dragging = false);
  }

  /* 音量 */
  const vBtn = document.getElementById('volumeBtn');
  if(vBtn) vBtn.onclick = (e) => {
    e.stopPropagation();
    showVolumeSlider(e, v);
  };

  /* 弹幕开关 */
  const dt = document.getElementById('dmToggle');
  if(dt) dt.onclick = () => {
    state.settings.danmakuOn = !state.settings.danmakuOn;
    dt.textContent = state.settings.danmakuOn ? '弹' : '关';
    dt.classList.toggle('on', state.settings.danmakuOn);
    save();
    toast(state.settings.danmakuOn ? '弹幕已开启' : '弹幕已关闭');
  };
  if(dt) dt.classList.toggle('on', state.settings.danmakuOn);

  /* 发弹幕 */
  const dmi = document.getElementById('dmInput');
  if(dmi) dmi.addEventListener('keydown', e => {
    if(e.key === 'Enter' && dmi.value.trim()){
      const text = dmi.value.trim();
      const type = state.settings.dmType;
      if((type === 'top' || type === 'bottom') && !requireVip('发送'+(type==='top'?'顶部':'底部')+'弹幕')){
        return;
      }
      shootDanmaku(text, { type: type });
      dmi.value = '';
      v.danmakuCount++;
    }
  });

  /* 倍速 */
  const sBtn = document.getElementById('speedBtn');
  if(sBtn) sBtn.onclick = (e) => { e.stopPropagation(); showSpeedMenu(); };

  /* 画质 */
  const qBtn = document.getElementById('qualityBtn');
  if(qBtn) qBtn.onclick = (e) => { e.stopPropagation(); showQualityMenu(); };

  /* 弹幕设置 */
  const dsBtn = document.getElementById('dmSetBtn');
  if(dsBtn) dsBtn.onclick = (e) => { e.stopPropagation(); openDanmakuSettings(); };

  /* 画中画 */
  const pipBtn = document.getElementById('pipBtn');
  if(pipBtn) pipBtn.onclick = togglePiP;

  /* 剧场模式 */
  const thBtn = document.getElementById('theaterBtn');
  if(thBtn) thBtn.onclick = toggleTheater;

  /* 全屏 */
  const fBtn = document.getElementById('fullBtn');
  if(fBtn) fBtn.onclick = toggleFullscreen;

  /* 三连按钮 */
  bindTripleButton(v);

  /* 分享 */
  const shareBtn = document.getElementById('btnShare');
  if(shareBtn) shareBtn.onclick = () => openShareModal(v);

  /* 稍后再看 */
  const wlBtn = document.getElementById('btnWatchLater');
  if(wlBtn) wlBtn.onclick = () => {
    if(!state.user.watchLater) state.user.watchLater = [];
    const i = state.user.watchLater.indexOf(v.id);
    if(i >= 0){
      state.user.watchLater.splice(i, 1);
      wlBtn.innerHTML = '⏰ 稍后再看';
      toast('已从「稍后再看」移除');
    }else{
      state.user.watchLater.unshift(v.id);
      wlBtn.innerHTML = '✔ 已加稍后再看';
      toast('已加入「稍后再看」');
    }
    save();
  };

  /* 关注 */
  const fb = document.getElementById('btnFollow');
  if(fb) fb.onclick = () => {
    fb.classList.toggle('on');
    fb.textContent = fb.classList.contains('on') ? '已关注' : '+ 关注';
  };

  /* 充电 */

  /* 弹幕类型切换 */

    el.onclick = () => {
      const t = el.dataset.dmtype;
      if((t === 'top' || t === 'bottom') && !isVip()){
        openVipModal('发送' + (t === 'top' ? '顶部' : '底部') + '弹幕');

      state.settings.dmType = t;
      refreshCommentTools();
      save();

  /* 标签点击 */
  $$('.tag-pill').forEach(el => {
    el.onclick = () => {
      document.getElementById('searchInput').value = el.dataset.tag;
      doSearch();
    };
  });

  /* 评论输入 */
  const send = document.getElementById('cmtSend');
  const ipt = document.getElementById('cmtIpt');
  const len = document.getElementById('cmtLen');
  if(ipt && len){
    ipt.addEventListener('input', () => { len.textContent = ipt.value.length; });
  }
  const emojiBtn = document.getElementById('emojiBtn');
  const emojiPanel = document.getElementById('emojiPanel');
  if(emojiBtn && emojiPanel){
    emojiBtn.onclick = (e) => {
      e.stopPropagation();
      emojiPanel.style.display = emojiPanel.style.display === 'none' ? 'flex' : 'none';
    };
    emojiPanel.addEventListener('click', e => {
      const s = e.target.closest('[data-emoji]');
      if(!s) return;
      ipt.value += s.dataset.emoji;
      len.textContent = ipt.value.length;
      ipt.focus();
    });
  }

  const doSend = () => {
    const txt = ipt.value.trim();
    if(!txt) return;
    const c = {
      id: uid(),
      user: { name: state.user.name, color: state.user.avatarColor, vip: true, level: 6 },
      text: txt,
      likes: ri(3, 60),
      liked: false,
      isUp: true,
      time: Date.now(),
      replies: []
    };
    v.comments.unshift(c);
    v.commentCountBase++;
    ipt.value = '';
    if(len) len.textContent = '0';
    if(emojiPanel) emojiPanel.style.display = 'none';
    renderCommentList(v, true);
    toast('评论发布成功');
    save();

    // 路人回复
    const delay = ri(1400, 3200);
    setTimeout(() => {
      if(!document.getElementById('cmtList')) return;
      if(!c.replies) c.replies = [];
      const r = { user: randomUser(), text: pick(REPLY_POOL) };
      c.replies.push(r);
      const node = document.querySelector('[data-cid="' + c.id + '"]');
      if(node){
        const body = node.querySelector('.cmt-body');
        let rbox = body.querySelector('.replies');
        if(!rbox){
          rbox = document.createElement('div');
          rbox.className = 'replies';
          body.appendChild(rbox);
        }
        rbox.insertAdjacentHTML('beforeend',
          '<div class="reply"><b>' + esc(r.user.name) + '</b>' +
          (r.user.vip ? ' <span class="badge vip">大会员</span>' : '') +
          '：' + esc(r.text) + '</div>');
      }
      toast('<span class="tn">' + esc(r.user.name) + '</span> 回复了你的评论');
    }, delay);
  };
  if(send) send.onclick = doSend;
  if(ipt) ipt.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
  });

  /* 评论排序 */
  $$('.cmt-sort button').forEach(btn => {
    btn.onclick = () => {
      cmtSort = btn.dataset.sort;
      $$('.cmt-sort button').forEach(x => x.classList.toggle('on', x === btn));
      renderCommentList(v, true);
    };
  });

  /* 加载更多 */
  const lm = document.getElementById('loadMore');
  if(lm) lm.onclick = () => {
    if(v.comments.length >= MAX_COMMENTS){
      toast('没有更多评论了');
      lm.disabled = true;
      return;
    }
    ensureComments(v, 12);
    v.commentCountBase += 12;
    renderCommentList(v, true);
    save();
  };

  /* 评论点赞/回复（事件委托） */
  document.addEventListener('click', function cmtClick(e){
    const lk = e.target.closest('[data-like]');
    if(lk){
      e.stopPropagation();
      const cid = lk.dataset.like;
      const video = currentVideo();
      if(!video) return;
      const c = video.comments.find(x => x.id === cid);
      if(!c) return;
      c.liked = !c.liked;
      c.likes += c.liked ? 1 : -1;
      lk.classList.toggle('on', c.liked);
      lk.textContent = '👍 ' + fmt(c.likes);
      return;
    }
    const rk = e.target.closest('[data-reply]');
    if(rk){
      e.stopPropagation();
      const cid = rk.dataset.reply;
      const video = currentVideo();
      if(!video) return;
      const c = video.comments.find(x => x.id === cid);
      if(!c) return;
      const box = document.querySelector('[data-reply-box="' + cid + '"]');
      if(!box) return;
      if(box.style.display === 'block'){
        box.style.display = 'none';
        return;
      }
      box.style.display = 'block';
      box.innerHTML = `
        <div class="reply-input">
          <input class="ri" placeholder="回复 @${esc(c.user.name)}" maxlength="100" />
          <button>发送</button>
        </div>
      `;
      const inp = box.querySelector('.ri');
      const btn = box.querySelector('button');
      const doReply = () => {
        const t = inp.value.trim();
        if(!t) return;
        if(!c.replies) c.replies = [];
        c.replies.push({ user: { name: state.user.name, color: state.user.avatarColor, vip: true }, text: t });
        box.style.display = 'none';
        // 重渲染这条评论
        const node = document.querySelector('[data-cid="' + cid + '"]');
        if(node){
          const body = node.querySelector('.cmt-body');
          let rbox = body.querySelector('.replies');
          if(!rbox){
            rbox = document.createElement('div');
            rbox.className = 'replies';
            body.appendChild(rbox);
          }
          rbox.insertAdjacentHTML('beforeend',
            '<div class="reply"><b>' + esc(state.user.name) + '</b>：' + esc(t) + '</div>');
        }
        toast('回复成功');
        save();
      };
      btn.onclick = doReply;
      inp.addEventListener('keydown', ev => {
        if(ev.key === 'Enter'){ ev.preventDefault(); doReply(); }
      });
      inp.focus();
    }
  });
}

/* 一键三连 */
function bindTripleButton(v){
  const likeBtn = document.getElementById('btnLike');
  const coinBtn = document.getElementById('btnCoin');
  const favBtn = document.getElementById('btnFav');
  if(!likeBtn) return;

  let pressTimer = null;
  let longPressed = false;

  const startPress = () => {
    longPressed = false;
    pressTimer = setTimeout(() => {
      longPressed = true;
      triggerTriple(v);
    }, 700);
  };
  const endPress = () => {
    clearTimeout(pressTimer);
    if(longPressed) return;
    // 短按：单独点赞
    v.liked = !v.liked;
    v.likes += v.liked ? 1 : -1;
    likeBtn.className = 'act-btn' + (v.liked ? ' on' : '');
    likeBtn.innerHTML = '👍 点赞 <span class="cnt">' + fmt(v.likes) + '</span>';
    if(v.liked) likeBurst(likeBtn);
    save();
  };

  likeBtn.addEventListener('mousedown', startPress);
  likeBtn.addEventListener('touchstart', startPress, {passive:true});
  likeBtn.addEventListener('mouseup', endPress);
  likeBtn.addEventListener('mouseleave', () => clearTimeout(pressTimer));
  likeBtn.addEventListener('touchend', endPress);

  coinBtn.addEventListener('click', () => {
    if(v.coined){
      v.coined = false;
      v.coins = Math.max(0, v.coins - 1);
      state.user.coins += 2;
      coinBtn.className = 'act-btn';
      coinBtn.innerHTML = '🪙 投币 <span class="cnt">' + fmt(v.coins) + '</span>';
      refreshTopbar();
      save();
      return;
    }
    if(state.user.coins < 2){
      toast('B币不足，去「我的」页面签到领取吧~');
      return;
    }
    state.user.coins -= 2;
    v.coined = true;
    v.coins += 1;
    coinBtn.className = 'act-btn on';
    coinBtn.innerHTML = '🪙 投币 <span class="cnt">' + fmt(v.coins) + '</span>';
    refreshTopbar();
    toast('投币成功，消耗 2 B币 🪙');
    save();
  });

  favBtn.addEventListener('click', () => {
    openFavModal(v);
  });
}

function triggerTriple(v){
  let changed = false;
  if(!v.liked){ v.liked = true; v.likes++; changed = true; }
  if(!v.coined && state.user.coins >= 2){
    state.user.coins -= 2;
    v.coined = true;
    v.coins++;
    changed = true;
  }
  if(!v.faved){ v.faved = true; v.favs++; changed = true; }

  const lb = document.getElementById('btnLike');
  const cb = document.getElementById('btnCoin');
  const fb = document.getElementById('btnFav');
  if(lb){ lb.className = 'act-btn on'; lb.innerHTML = '👍 点赞 <span class="cnt">' + fmt(v.likes) + '</span>'; }
  if(cb){ cb.className = 'act-btn on'; cb.innerHTML = '🪙 投币 <span class="cnt">' + fmt(v.coins) + '</span>'; }
  if(fb){ fb.className = 'act-btn on'; fb.innerHTML = '⭐ 收藏 <span class="cnt">' + fmt(v.favs) + '</span>'; }

  refreshTopbar();
  save();

  if(changed){
    showTripleAnim();
    toast('一键三连成功！感谢支持 ❤️🪙⭐');
  }else{
    toast('已经三连过啦，感谢支持 ❤️');
  }
}

function showTripleAnim(){
  const el = document.createElement('div');
  el.className = 'triple-anim';
  el.textContent = '👍 🪙 ⭐';
  el.style.left = '50%';
  el.style.top = '50%';
  el.style.transform = 'translate(-50%,-50%)';
  el.style.fontSize = '38px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

function likeBurst(el){
  const r = el.getBoundingClientRect();
  for(let i=0;i<5;i++){
    const b = document.createElement('div');
    b.className = 'like-burst';
    b.textContent = '👍';
    b.style.left = (r.left + r.width/2) + 'px';
    b.style.top = (r.top + r.height/2) + 'px';
    b.style.setProperty('--bx', ri(-40, 40) + 'px');
    b.style.setProperty('--by', ri(-70, -30) + 'px');
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 850);
  }
}

/* 音量滑块 */
function showVolumeSlider(e, v){
  const existing = document.getElementById('volSlider');
  if(existing){ existing.remove(); return; }
  const btn = e.currentTarget;
  const r = btn.getBoundingClientRect();
  const slider = document.createElement('div');
  slider.id = 'volSlider';
  slider.style.cssText = `position:fixed;left:${r.left - 8}px;bottom:${window.innerHeight - r.top + 8}px;
    background:rgba(24,25,28,.96);border-radius:8px;padding:10px 6px;z-index:900;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.3);animation:menuIn .15s ease`;
  slider.innerHTML = `
    <input type="range" min="0" max="100" value="${Math.round(state.settings.volume*100)}"
           style="writing-mode:vertical-lr;direction:rtl;width:4px;height:80px;
                  -webkit-appearance:slider-vertical;appearance:slider-vertical;
                  background:#555;border-radius:2px;outline:none" />
    <span style="color:#fff;font-size:11px">${Math.round(state.settings.volume*100)}</span>
  `;
  document.body.appendChild(slider);
  const inp = slider.querySelector('input');
  const lbl = slider.querySelector('span');
  const update = () => {
    const val = inp.value / 100;
    state.settings.volume = val;
    state.settings.muted = val === 0;
    const ve = document.getElementById('videoEl');
    if(ve){ ve.volume = val; ve.muted = state.settings.muted; }
    const vb = document.getElementById('volumeBtn');
    if(vb) vb.textContent = val === 0 ? '🔇' : (val < 0.5 ? '🔉' : '🔊');
    lbl.textContent = inp.value;
    save();
  };
  inp.addEventListener('input', update);
  setTimeout(() => {
    const close = (ev) => {
      if(!slider.contains(ev.target) && ev.target !== btn){
        slider.remove();
        document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 100);
}

function renderUpload(){
  stopPlayer();
  currentVideoId = null;
  const parts = ['生活','美食','游戏','知识','科技','鬼畜','音乐','影视'];
  const tagOptions = ['日常','Vlog','美食制作','探店','单机游戏','实况','科普','学习',
    '数码','测评','音MAD','搞笑','翻唱','原创音乐','影评','剪辑'];

  view.innerHTML = `
    <div class="panel">
      <h2>📤 投稿 · 创作中心</h2>
      <div class="field">
        <label>视频文件（可选，纯本地播放，不会上传到任何服务器）</label>

          ${parts.map(p => '<div class="chip ' + (uploadState.partition===p?'on':'') + '" data-part="' + p + '">' + p + '</div>').join('')}
        </div>
      </div>
      <div class="field">
        <label>标签（可多选，决定评论区的画风 😏）</label>
        <div class="chips" id="tagChips">
          ${tagOptions.map(t => '<div class="chip ' + (uploadState.tags.indexOf(t)>=0?'on':'') + '" data-tag="' + t + '">' + t + '</div>').join('')}
        </div>
      </div>
      <div class="field">
        <label>封面配色</label>
        <div class="chips" id="coverChips">
          ${COVER_GRADIENTS.slice(0,12).map((g,i) => `
            <div class="chip color-chip ${uploadState.coverIdx===i?'on':''}"
                 data-cover="${i}"
                 style="background:linear-gradient(135deg,${g[0]},${g[1]})"></div>
          `).join('')}
        </div>
      </div>
      <div class="field">
        <label>简介</label>
        <textarea id="upDesc" placeholder="介绍一下这个视频吧~">这个视频做了很久，希望你们喜欢~ 三连支持一下吧！</textarea>
      </div>
      <div class="field">
        <label>观看权限</label>
        <div class="chips" id="vipOnlyChips">
          <div class="chip on" data-vip="0">所有人可看</div>
          <div class="chip" data-vip="1">👑 大会员专享</div>
        </div>
      </div>
      <button class="submit-btn" id="doUpload">发布视频</button>
    </div>
  `;

  let vipOnly = false;
  const vipChips = document.getElementById('vipOnlyChips');
  vipChips.addEventListener('click', e => {
    const c = e.target.closest('[data-vip]');
    if(!c) return;
    vipOnly = c.dataset.vip === '1';
    Array.from(vipChips.children).forEach(x => x.classList.toggle('on', x === c));
  });

  document.getElementById('fileDrop').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    if(uploadState.fileUrl) URL.revokeObjectURL(uploadState.fileUrl);
    uploadState.fileUrl = URL.createObjectURL(f);
    uploadState.fileName = f.name;
    const drop = document.getElementById('fileDrop');
    drop.textContent = '已选择：' + f.name;
    drop.classList.add('has');
  };

  document.getElementById('partChips').onclick = e => {
    const c = e.target.closest('[data-part]');
    if(!c) return;
    uploadState.partition = c.dataset.part;
    $$('#partChips .chip').forEach(x => x.classList.toggle('on', x === c));
  };
  document.getElementById('tagChips').onclick = e => {
    const c = e.target.closest('[data-tag]');
    if(!c) return;
    const t = c.dataset.tag;
    const i = uploadState.tags.indexOf(t);
    if(i >= 0) uploadState.tags.splice(i,1); else uploadState.tags.push(t);
    c.classList.toggle('on');
  };
  document.getElementById('coverChips').onclick = e => {
    const c = e.target.closest('[data-cover]');
    if(!c) return;
    uploadState.coverIdx = Number(c.dataset.cover);
    $$('#coverChips .chip').forEach(x => x.classList.toggle('on', x === c));
  };

  document.getElementById('doUpload').onclick = () => {
    const title = document.getElementById('upTitle').value.trim();
    if(!title){ toast('请先填写视频标题'); return; }
    const tags = uploadState.tags.length ? uploadState.tags.slice() : [uploadState.partition];
    const desc = document.getElementById('upDesc').value.trim();

    const v = makeVideo(title, uploadState.partition, tags, desc, vipOnly);
    v.coverColors = COVER_GRADIENTS[uploadState.coverIdx];
    v.videoUrl = uploadState.fileUrl;
    v.views = ri(0, 120);
    v.danmakuCount = ri(0, 20);
    v.likes = ri(0, 30);
    v.coins = 0;
    v.favs = 0;
    v.shares = 0;
    v.commentCountBase = ri(0, 8);
    v.pubTime = Date.now();
    v.seeded = false;

    state.videos.unshift(v);
    seedComments(v);
    save();
    uploadState = { partition:'生活', tags:[], coverIdx:0, fileUrl:null, fileName:'' };

    toast('投稿成功！正在转码…');
    setTimeout(() => {
      toast('审核通过，视频已发布 🎉');
      go('video', v.id);
      setTimeout(() => {
        const fan = pick(SOLO_NAMES);
        state.user.fans += ri(50, 400);
        toast('<span class="tn">' + esc(fan) + '</span> 关注了你');
        refreshTopbar();
        save();
      }, 2600);
    }, 1400);
  };
}

let vipModalPlan = 3;
function openVipModal(reason){
  if(isVip()){ go('vip'); return; }
  const reasonText = reason ? '开通后即可' + reason : '开通大会员，畅享 9 大专属特权';
  openModal(`
    <div class="vip-hero">
      <div class="vc">👑</div>
      <div class="vt">哔哩哔哩大会员</div>
      <div class="vs">${esc(reasonText)}</div>
    </div>
    <div class="modal-body">
      <div class="rights-list">
        <div class="right-item"><div class="ri">🎬</div><div class="rt">超清画质</div></div>
        <div class="right-item"><div class="ri">💬</div><div class="rt">彩色弹幕</div></div>
        <div class="right-item"><div class="ri">🎀</div><div class="rt">专属装扮</div></div>
        <div class="right-item"><div class="ri">🪙</div><div class="rt">每月B币</div></div>
        <div class="right-item"><div class="ri">🚀</div><div class="rt">专享视频</div></div>
        <div class="right-item"><div class="ri">🏅</div><div class="rt">尊贵标识</div></div>
      </div>
      <div class="plan-list" id="mPlans">
        <div class="plan-mini" data-plan="1"><div class="pp">¥15</div><div class="pn">1个月</div></div>
        <div class="plan-mini on" data-plan="3"><div class="pp">¥45</div><div class="pn">3个月</div></div>
        <div class="plan-mini" data-plan="12"><div class="pp">¥148</div><div class="pn">12个月</div></div>
      </div>
      <button class="pay-btn" id="mPayBtn"><span>立即支付</span></button>
      <div style="font-size:11px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.6">
        本页面为纯本地模拟，不会产生任何真实扣款
      </div>
    </div>
  `);
  const plans = document.getElementById('mPlans');
  plans.addEventListener('click', e => {
    const p = e.target.closest('[data-plan]');
    if(!p) return;
    vipModalPlan = Number(p.dataset.plan);
    Array.from(plans.children).forEach(x => x.classList.toggle('on', x === p));
  });
  const pay = document.getElementById('mPayBtn');
  pay.onclick = () => {
    pay.disabled = true;
    pay.innerHTML = '<span class="spin"></span><span>支付中…</span>';
    setTimeout(() => {
      const now = Date.now();
      const base = isVip() ? state.user.vip.expire : now;
      state.user.vip.expire = Math.max(base, now) + vipModalPlan * 30 * 86400000;
      state.user.vip.active = true;
      state.user.vip.level = Math.min(6, (state.user.vip.level || 1) + 1);
      state.user.vip.autoRenew = true;
      save();
      refreshTopbar();
      applyTheme();
      closeModal();
      toast('<span class="tn">vip-toast</span>大会员开通成功！欢迎加入 👑', 4200);
      if(currentVideoId) renderVideoPage(currentVideoId);
      else if(view.querySelector('.vip-page')) renderVipCenter();
    }, 1100);
  };
}

function openChargeModal(v){
  const opts = [1, 2, 5, 10, 30];
  openModal(`
    <div class="modal-body">
      <h2 style="font-size:18px;margin-bottom:6px">🔋 给 UP 主充电</h2>
      <div style="font-size:13px;color:var(--sub);margin-bottom:18px">
        当前电池：<b style="color:var(--pink)">${state.user.battery}</b> 个
      </div>
      <div class="chips" id="chargeOpts" style="margin-bottom:18px">
        ${opts.map(n => '<div class="chip ' + (n===2?'on':'') + '" data-n="' + n + '">' + n + ' 个</div>').join('')}
      </div>
      <div style="background:#f7f8fa;border-radius:10px;padding:14px;font-size:13px;
                  color:#61666d;line-height:1.8;margin-bottom:16px">
        💡 充电是观众对 UP 主的支持，<br/>
        每个电池 = 1 元（模拟），全部计入 UP 主收益。
      </div>
      <button class="pay-btn" id="doCharge"><span>确认充电</span></button>
    </div>
  `);
  let amount = 2;
  const optsBox = document.getElementById('chargeOpts');
  optsBox.addEventListener('click', e => {
    const c = e.target.closest('[data-n]');
    if(!c) return;
    amount = Number(c.dataset.n);
    Array.from(optsBox.children).forEach(x => x.classList.toggle('on', x === c));
  });
  document.getElementById('doCharge').onclick = () => {
    if(state.user.battery < amount){
      toast('电池不足，先去「我的」页面签到获取吧~');
      return;
    }
    state.user.battery -= amount;
    v.coins += amount;
    state.user.fans += ri(1, 20);
    refreshTopbar();
    save();
    closeModal();
    toast('充电成功！感谢你的支持 🔋 ×' + amount, 3200);
    if(currentVideoId === v.id){
      const cb = document.getElementById('btnCoin');
      if(cb) cb.innerHTML = '🪙 投币 <span class="cnt">' + fmt(v.coins) + '</span>';
    }
  };
}

/* =========================================================
   11. 路由
   ========================================================= */
function go(name, param){
  closeMenuPop();
  // 如果在剧场模式，先退出
  const player = document.getElementById('player');
  if(player && player.classList.contains('theater')){
    document.body.classList.remove('theater');
    player.classList.remove('theater');
    if(screen.orientation && screen.orientation.unlock){
      try{ screen.orientation.unlock(); }catch(e){}
    }
    const hint = document.getElementById('rotateHint');
    if(hint) hint.classList.remove('show');
  }
  if(name === 'home') renderHome();
  else if(name === 'video') renderVideoPage(param);
  else if(name === 'upload') renderUpload();
  else if(name === 'me') renderMe();
  else if(name === 'vip') renderVipCenter();
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if(nav){
    go(nav.dataset.nav);
    return;
  }
  const card = e.target.closest('[data-vid]');
  if(card){
    go('video', card.dataset.vid);
    return;
  }
});

document.getElementById('vipEntry').onclick = () => {
  if(isVip()) go('vip');
  else openVipModal('');
};
document.getElementById('coinPill').onclick = () => go('me');
document.getElementById('myAvatar').onclick = () => go('me');
document.getElementById('searchBtn').onclick = doSearch;
document.getElementById('searchInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') doSearch();
});
function doSearch(){
  const kw = document.getElementById('searchInput').value.trim();
  if(!kw){ go('home'); return; }
  renderSearch(kw);
}

/* 退出横屏提示 */
document.getElementById('exitRotate').onclick = () => {
  const player = document.getElementById('player');
  if(player && player.classList.contains('theater')) toggleTheater();
};

/* 窗口大小变化时，若已不在横屏则隐藏提示 */
window.addEventListener('resize', () => {
  if(window.innerWidth > window.innerHeight){
    const hint = document.getElementById('rotateHint');
    if(hint) hint.classList.remove('show');
  }
});

/* 全屏状态变化：同步图标 */
document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('fullBtn');
  if(btn){
    btn.textContent = document.fullscreenElement ? '⛉' : '⛶';
    btn.title = document.fullscreenElement ? '退出全屏' : '全屏';
  }
});

/* 键盘快捷键 */
document.addEventListener('keydown', e => {
  // 只在播放页生效
  if(!currentVideoId) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if(document.getElementById('modalRoot').style.display === 'block') return;

  switch(e.key){
    case ' ':
      e.preventDefault();
      const pb = document.getElementById('playBtn');
      if(pb) pb.click();
      break;
    case 'ArrowLeft':
      if(P){ P.cur = Math.max(0, P.cur - 5); P.idx = 0;
        const ve = document.getElementById('videoEl');
        if(P.real && ve) ve.currentTime = P.cur;
        updateProgressUI(); }
      break;
    case 'ArrowRight':
      if(P){ P.cur = Math.min(P.dur, P.cur + 5); P.idx = 0;
        const ve = document.getElementById('videoEl');
        if(P.real && ve) ve.currentTime = P.cur;
        updateProgressUI(); }
      break;
    case 'ArrowUp':
      e.preventDefault();
      state.settings.volume = Math.min(1, state.settings.volume + 0.1);
      state.settings.muted = false;
      const ve2 = document.getElementById('videoEl');
      if(ve2){ ve2.volume = state.settings.volume; ve2.muted = false; }
      const vb = document.getElementById('volumeBtn');
      if(vb) vb.textContent = state.settings.volume === 0 ? '🔇' : '🔊';
      save();
      break;
    case 'ArrowDown':
      e.preventDefault();
      state.settings.volume = Math.max(0, state.settings.volume - 0.1);
      state.settings.muted = state.settings.volume === 0;
      const ve3 = document.getElementById('videoEl');
      if(ve3){ ve3.volume = state.settings.volume; ve3.muted = state.settings.muted; }
      const vb2 = document.getElementById('volumeBtn');
      if(vb2) vb2.textContent = state.settings.volume === 0 ? '🔇' : '🔊';
      save();
      break;
    case 'f':
    case 'F':
      toggleFullscreen();
      break;
    case 't':
    case 'T':
      toggleTheater();
      break;
    case 'd':
    case 'D':
      const dtb = document.getElementById('dmToggle');
      if(dtb) dtb.click();
      break;
    case 'm':
    case 'M':
      state.settings.muted = !state.settings.muted;
      const ve4 = document.getElementById('videoEl');
      if(ve4) ve4.muted = state.settings.muted;
      const vb3 = document.getElementById('volumeBtn');
      if(vb3) vb3.textContent = state.settings.muted ? '🔇' : '🔊';
      save();
      break;
  }
});

/* =========================================================
   12. 氛围定时器
   ========================================================= */
function startAmbient(){
  setInterval(() => {
    state.user.fans += ri(2, 32);
    const f1 = document.getElementById('fansNum');
    if(f1) f1.textContent = fmt(state.user.fans);
    const f2 = document.getElementById('meFans');
    if(f2) f2.textContent = fmt(state.user.fans);
  }, 2400);

  const NOTIFY_TEMPLATES = [
    '{n} 评论了你的视频',
    '{n} 点赞了你的视频',
    '{n} 关注了你',
    '{n} 收藏了你的视频',
    '{n} 给你投了 2 个硬币',
    '{n} 分享了你的视频'
  ];
  setInterval(() => {
    if(document.getElementById('modalRoot').style.display === 'block') return;
    const t = pick(NOTIFY_TEMPLATES);
    const n = Math.random() < 0.6 ? pick(SOLO_NAMES) : pick(NAME_A) + pick(NAME_B);
    toast(t.replace('{n}', '<span class="tn">' + esc(n) + '</span>'), 2600);
    state.user.fans += ri(0, 8);
  }, 11000);

  setInterval(() => {
    const v = currentVideo();
    if(!v) return;
    if(!document.getElementById('cmtList')) return;
    if(v.comments.length >= MAX_COMMENTS) return;
    const c = makeComment(v, {});
    c.time = Date.now();
    c.likes = ri(0, 12);
    v.comments.unshift(c);
    v.commentCountBase++;
    const list = document.getElementById('cmtList');
    if(list && cmtSort === 'new'){
      list.insertAdjacentHTML('afterbegin', commentHTML(c, v));
      while(list.children.length > 60) list.lastElementChild.remove();
      const cc = document.getElementById('cmtCount');
      if(cc) cc.textContent = fmt(v.commentCountBase + v.comments.length);
    }
  }, 7000);
}

/* =========================================================
   13. 启动
   ========================================================= */
initData();
refreshTopbar();
go('home');
startAmbient();

setTimeout(() => {
  toast('欢迎回来，<span class="tn">' + esc(state.user.name) + '</span> 👑', 4000);
}, 700);
setTimeout(() => {
  toast('你有 <span class="tn">' + ri(99,999) + '</span> 条新评论待查看', 4000);
}, 3600);
setTimeout(() => {
  if(isVip()){
    toast('<span class="tn">vip-toast</span>大会员还有 ' + vipDaysLeft() + ' 天到期，感谢支持 👑', 4200);
  }
}, 7200);

window.addEventListener('beforeunload', () => {
  state.videos.forEach(v => {
    if(v.videoUrl && v.videoUrl.indexOf('blob:') === 0){
      try{ URL.revokeObjectURL(v.videoUrl); }catch(e){}
    }
  });
});

/* 支持从 URL hash 直达视频 */
(function(){
  const m = location.hash.match(/#video=([\w]+)/);
  if(m){
    const v = state.videos.find(x => x.id === m[1]);
    if(v) setTimeout(() => go('video', v.id), 100);
  }
})();
</script>
