    }

        background: rgba(255,255,255,.12);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 12.5px;
        line-height: 1.7;
        margin-bottom: 20px;
        opacity: .92;
    }

    .input-panel {
        background: rgba(255,255,255,.15);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 16px;
        padding: 18px;
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }
    .input-panel input {
        flex: 1;
        background: rgba(255,255,255,.95);
        border: none;
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 16px;
        color: #333;
        outline: none;
        transition: box-shadow .2s;
    }
    .input-panel input:focus {
        box-shadow: 0 0 0 3px rgba(255,224,102,.6);
    }
    .input-panel button {
        background: linear-gradient(135deg, #f6d365, #fda085);
        border: none;
        border-radius: 10px;
        padding: 0 26px;
        font-size: 16px;
        font-weight: bold;
        color: #5a2a00;
        cursor: pointer;
        transition: transform .15s, box-shadow .2s;
        box-shadow: 0 4px 14px rgba(253,160,133,.5);
        white-space: nowrap;
    }
    .input-panel button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(253,160,133,.7);
    }
    .input-panel button:active { transform: translateY(0); }

    .tips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 22px;
        font-size: 12.5px;
    }
    .tips span {
        background: rgba(255,255,255,.15);
        border: 1px solid rgba(255,255,255,.25);
        padding: 6px 12px;
        border-radius: 20px;
    }

    .result {

        color: #333;
        border-radius: 20px;
        padding: 28px 26px;
        box-shadow: 0 20px 60px rgba(0,0,0,.3);
        display: none;
        animation: popIn .45s cubic-bezier(.34,1.56,.64,1);
        position: relative;
        overflow: hidden;
    }
    .result.show { display: block; }

    @keyframes popIn {
        0%   { transform: scale(.7); opacity: 0; }
        100% { transform: scale(1);  opacity: 1; }
    }

    .result::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        background: linear-gradient(90deg, #f6d365, #fda085, #f093fb, #667eea);
    }

    .result-header {
        font-size: 13px;
        color: #888;
        margin-bottom: 14px;
        letter-spacing: 1px;
    }

    .reward-name {
        font-size: 24px;
        font-weight: 800;
        color: #5a2a8a;
        margin-bottom: 12px;

        line-height: 1.3;
    }
    .reward-desc {

        color: #555;
        line-height: 1.7;
        margin-bottom: 18px;
        padding: 12px 16px;
        background: #f7f5ff;
        border-left: 4px solid #a78bfa;
        border-radius: 6px;
        word-break: break-all;
    }
    .reward-link-label {
        font-size: 12px;
        color: #999;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }

        display: flex;
        gap: 8px;
        align-items: stretch;
    }

        flex: 1;
        background: #f0f4ff;
        border: 1px dashed #a5b4fc;
        border-radius: 10px;
        padding: 12px 14px;
        font-family: "Consolas", monospace;
        font-size: 13px;
        color: #4338ca;
        word-break: break-all;
        user-select: all;
        line-height: 1.5;
    }
    .btn-copy, .btn-open {
        border: none;
        border-radius: 10px;
        padding: 0 16px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity .2s, transform .15s;
        white-space: nowrap;
    }
    .btn-copy {
        background: #e0e7ff;
        color: #4338ca;
    }
    .btn-open {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
    }
    .btn-copy:hover, .btn-open:hover { opacity: .85; transform: translateY(-1px); }

        background: rgba(255,255,255,.97);

        border-radius: 16px;
        padding: 20px;
        margin-top: 16px;

        color: #666;

    .match-item {

        border-radius: 10px;
        background: #f8f8fc;
        margin-bottom: 8px;
        cursor: pointer;

        font-size: 15px;

        color: #4338ca;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        margin-right: 8px;
        font-family: monospace;

/* ================================================================
   以下为逻辑代码，一般不需要修改
   ================================================================ */
const $ = id => document.getElementById(id);
const input       = $("userInput");
const actionBtn   = $("actionBtn");
const loading     = $("loading");
const result      = $("result");
const resultHeader= $("resultHeader");
const rewardName  = $("rewardName");
const rewardDesc  = $("rewardDesc");
const rewardLink  = $("rewardLink");
const matchList   = $("matchList");
const errorBox    = $("errorBox");
const historyBox  = $("history");
const historyList = $("historyList");
const stats       = $("stats");

let lastIndex = null;   // 防止连续抽到同一个
let history   = [];     // 本次抽奖记录
let currentReward = null;

/* ---------- 工具函数 ---------- */
function hideAll() {
    result.classList.remove("show");
    matchList.classList.remove("show");
    errorBox.classList.remove("show");
}

function showError(msg) {
    hideAll();
    errorBox.textContent = "⚠️ " + msg;
    errorBox.classList.add("show");
}

function drawRandom() {
    if (REWARDS.length <= 1) return { index: 0, reward: REWARDS[0] };
    let idx = Math.floor(Math.random() * REWARDS.length);
    while (idx === lastIndex) {
        idx = Math.floor(Math.random() * REWARDS.length);
    }
    lastIndex = idx;
    return { index: idx, reward: REWARDS[idx] };
}

function pickByIndex(num) {
    if (num >= 1 && num <= REWARDS.length) {
        return { index: num - 1, reward: REWARDS[num - 1] };
    }
    return null;
}

function pickByKeyword(kw) {
    const lower = kw.toLowerCase();
    const matches = [];
    REWARDS.forEach((r, i) => {
        if (r.name.toLowerCase().includes(lower) ||
            r.desc.toLowerCase().includes(lower)) {
            matches.push({ index: i, reward: r });
        }
    });
    return matches;
}

function formatIndex(i) {
    return "#" + String(i + 1).padStart(3, "0");
}

/* ---------- 展示结果 ---------- */
function showReward(reward, index, title) {
    hideAll();
    currentReward = reward;

    resultHeader.textContent = title;
    rewardName.textContent   = reward.name;
    rewardDesc.textContent   = reward.desc;
    rewardLink.textContent   = reward.link;

    result.classList.add("show");
    result.scrollIntoView({ behavior: "smooth", block: "nearest" });

    // 记入历史
    history.push({ index: index, reward: reward, time: new Date() });
    renderHistory();
}

function showMatches(matches, keyword) {
    hideAll();
    matchList.innerHTML =
        `<h3>🔍 找到 ${matches.length} 个包含「${escapeHtml(keyword)}」的奖励，点击选择：</h3>`;

    matches.forEach((m, i) => {
        const div = document.createElement("div");
        div.className = "match-item";
        div.innerHTML = `
            <div class="m-name">
                <span class="m-idx">${formatIndex(m.index)}</span>${escapeHtml(m.reward.name)}
            </div>
            <div class="m-desc">${escapeHtml(m.reward.desc)}</div>
        `;
        div.addEventListener("click", () => {
            showReward(m.reward, m.index, `🎯 定向取「${keyword}」`);
        });
        matchList.appendChild(div);
    });

    matchList.classList.add("show");
}

function escapeHtml(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function renderHistory() {
    if (history.length === 0) {
        historyBox.classList.remove("show");
        stats.textContent = "";
        return;
    }
    historyBox.classList.add("show");
    historyList.innerHTML = "";
    // 倒序显示，最新的在上面
    history.slice().reverse().forEach((h, i) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
            <span class="h-idx">${formatIndex(h.index)}</span>
            <span>${escapeHtml(h.reward.name)}</span>
        `;
        historyList.appendChild(div);
    });
    stats.textContent = `本次共抽取 ${history.length} 次`;
}

/* ---------- 主流程 ---------- */
function handleAction() {
    const text = input.value.trim();

    // 1) 空输入 → 随机抽
    if (text === "") {
        doRandom();
        return;
    }

    // 2) 纯数字 → 定向取第 N 号
    if (/^\d+$/.test(text)) {
        const num = parseInt(text, 10);
        const hit = pickByIndex(num);
        if (!hit) {
            showError(`编号超出范围，本奖励池只有 1 ~ ${REWARDS.length} 号。`);
            return;
        }
        showReward(hit.reward, hit.index, `🎯 定向取第 ${num} 号奖励`);
        input.value = "";
        return;
    }

    // 3) 其他文字 → 模糊匹配
    const matches = pickByKeyword(text);
    if (matches.length === 0) {
        showError(`没有找到包含「${text}」的奖励。可以试试直接输入编号，例如 42`);
        return;
    }
    if (matches.length === 1) {
        showReward(matches[0].reward, matches[0].index, `🎯 定向取「${text}」`);
        input.value = "";
    } else {
        showMatches(matches, text);
        input.value = "";
    }
}

function doRandom() {
    hideAll();
    loading.classList.add("show");
    result.classList.remove("show");

    setTimeout(() => {
        loading.classList.remove("show");
        const { index, reward } = drawRandom();
        showReward(reward, index, "🎉 恭喜获得奖励！");
    }, 900);
}

/* ---------- 事件绑定 ---------- */
actionBtn.addEventListener("click", () => {
    const text = input.value.trim();
    if (text === "") {
        // 输入框为空时点击按钮 → 随机抽
        doRandom();
    } else {
        handleAction();
    }
});

input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        const text = input.value.trim();
        if (text === "") {
            doRandom();
        } else {
            handleAction();
        }
    }
});

// 复制按钮
$("copyBtn").addEventListener("click", () => {
    if (!currentReward) return;
    const link = currentReward.link;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(
            () => flashCopyBtn("✅ 已复制"),
            () => fallbackCopy(link)
        );
    } else {
        fallbackCopy(link);
    }
});

function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); flashCopyBtn("✅ 已复制"); }
    catch (e) { flashCopyBtn("❌ 复制失败"); }
    document.body.removeChild(ta);
}

function flashCopyBtn(msg) {
    const btn = $("copyBtn");
    const old = btn.textContent;
    btn.textContent = msg;
    setTimeout(() => { btn.textContent = old; }, 1200);
}

// 打开链接按钮
$("openBtn").addEventListener("click", () => {
    if (!currentReward) return;
    window.open(currentReward.link, "_blank", "noopener,noreferrer");
});

// 页面加载后自动聚焦输入框
window.addEventListener("load", () => {
    input.focus();
    if (REWARDS.length > 0) {
        stats.textContent = `奖励池已加载：共 ${REWARDS.length} 个盲盒`;
    }
});
